name = "macscope-remote"
main = "src/worker.ts"
compatibility_date = "2026-08-30"
workers_dev = true

[vars]
PUBLIC_BASE_URL = "https://macscope-remote.macscope-relay.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "macscope-remote"
database_id = "6ff6685f-6515-4f4b-83c4-aefd1dc3d066"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "EnvironmentRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["EnvironmentRoom"]

[triggers]
crons = ["17 3 * * *"]
